<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Lost and Found</title>
</head>
<body>
    <header>
        <div class="navbar">
            <div id="Logo">Logo</div>
            <div class="navbar_links">
                <a id="homePage" href="index.html">Home</a>
                <a id="reportPage" href="add_item.html">Report Items</a>
                <a id="itemsPage" href="itmes.html">View Items</a>
            </div>
        </div>
        <div class="heroSec">
            <div class="heroSecLeft">
                <div class="banner">
                    <h3 class="bannerLine">Lost Something</h3>
                    <h3 class="bannerLine">Find Something</h3>
                    <p id="bannerQuote">Help ypur fellow students by reporting lost or found items</p>
                </div>
                <div class="heroSecLeftButtons">
                    <button id="report">
                        <a id="reportPage" href="add_item.html">Report Items</a>
                    </button>
                    <button id="view">
                        <a id="itemsPage" href="itmes.html">View Items</a>
                    </button>
                </div>
            </div>
            <div class="herSecRight">
                <div class="bannerImg">
                    <img src="" alt="">
                </div>
            </div>
        </div>
    </header>
    <main>
        <div class="items">
            <div id="totalItems" class="itemsCount">Total Items</div>
            <div id="lostItems" class="itemsCount">Lost Items</div>
            <div id="foundItems" class="itemsCount">Found Items</div>
        </div>
        <div class="recentItemsCards">
            <h1 id="recentItemsHeader">Recent Items</h1>
        </div>
    </main>
</body>
</html>
