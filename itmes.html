<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/items.css">
    <title>View Items</title>
</head>
<body>
    <header>
        <div class="navbar">
            <div id="Logo">Logo</div>
            <div class="navbar_links">
                <a id="homePage" href="index.html">Home</a>
                <a id="reportPage" href="add_item.html">Report Items</a>
                <a id="itemsPage" href="itmes.html">View Items</a>
            </div>
        </div>
    </header>
    <main>
        <div class="searchBar">
            <h2 id="heading">Browse Items</h2>
            <p id="description">Search and filter reported items</p>
            <input id="searchItem" type="search" placeholder="Search items..">
        </div>
        <div class="filter">
            <label for="category"> Select Category
                <select  id="category">
                    <option value="all">All</option>
                    <option value="stationery">Stationery</option>
                    <option value="electronics">Electronics</option>
                    <option value="documents">Documents</option>
                    <option value="personal item">Personal Items</option>
                </select>
           
            </label>
            <label for="sortBy">Sort By
                <select  id="sortBy">
                    <option value="all">All</option>
                    <option value="Lost">Lost</option>
                    <option value="Found">Found</option>
                </select>
            
            </label>
        </div>
        <div class="allCards">
            
        </div>
    </main>
    <script src="JS/items.js"></script>
</body>
</html>
